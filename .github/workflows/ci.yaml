name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Run check
        run: pnpm check

      - name: Run build
        run: pnpm build
